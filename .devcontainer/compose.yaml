services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    working_dir: /workspaces/coderhouse-data-analytics
    volumes:
      - ..:/workspaces/coderhouse-data-analytics:cached
    network_mode: service:db
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    env_file: .env
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-C", "-b", "-l", "3", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  sqlserver-data:
